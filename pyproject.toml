[project]
name = "efny-pipeline"
version = "0.1.0"
description = "Reproducible EFNY neuroimaging workflows"
requires-python = ">=3.11,<3.13"
dependencies = [
    "nibabel>=5.3,<6",
    "numpy==2.2.6",
]

[project.scripts]
efny-imaging = "imaging.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imaging"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
